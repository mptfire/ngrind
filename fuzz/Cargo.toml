[package]
name = "ngrind-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ngrind = { path = "../ngrind", default-features = false }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "parse_pattern"
path = "fuzz_targets/parse_pattern.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_tags"
path = "fuzz_targets/parse_tags.rs"
test = false
doc = false
bench = false

[[bin]]
name = "event_split"
path = "fuzz_targets/event_split.rs"
test = false
doc = false
bench = false
